# Perfil de produção, ativado com SPRING_PROFILES_ACTIVE=prod (definido no render.yaml).
# Sobrescreve só o que muda em relação ao application.properties.

# PostgreSQL: o Render preenche estas variáveis a partir do banco "pix-db" (render.yaml).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O plano gratuito do Postgres aceita poucas conexões; 5 é suficiente para esta API.
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=false
spring.jpa.show-sql=false
