spring.application.name=pix-api

# O Render informa a porta na variável PORT; localmente usamos 8080.
server.port=${PORT:8080}

# Banco padrão (local e testes): H2 em memória, zera a cada reinício.
# Em produção o perfil "prod" (application-prod.properties) troca para PostgreSQL.
spring.datasource.url=jdbc:h2:mem:pixdb
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.jpa.show-sql=${SHOW_SQL:true}

# O schema vem das migrações do Flyway (src/main/resources/db/migration).
# "validate": o Hibernate só confere se as entidades batem com as tabelas; nunca altera o banco.
spring.jpa.hibernate.ddl-auto=validate

# Origens liberadas no CORS (separadas por vírgula). Em produção, sobrescreva com PIX_CORS_ORIGENS.
pix.cors.origens=https://rafaelnicolauios.github.io,http://localhost:*,http://127.0.0.1:*

# Contas de exemplo ao iniciar, só se o banco estiver vazio (DadosIniciais.java)
pix.seed.enabled=true

# Para onde vão os eventos de domínio: "log" (padrão, usado no Render) ou "kafka".
pix.mensageria=${PIX_MENSAGERIA:log}
