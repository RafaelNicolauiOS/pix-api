spring.application.name=pix-api

# O Render informa a porta na variável PORT; localmente usamos 8080.
server.port=${PORT:8080}

# Banco H2 em memória (zera a cada reinício)
spring.datasource.url=jdbc:h2:mem:pixdb
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.jpa.show-sql=${SHOW_SQL:true}

# Origens liberadas no CORS (separadas por vírgula). Em produção, sobrescreva com PIX_CORS_ORIGENS.
pix.cors.origens=https://rafaelnicolauios.github.io,http://localhost:*,http://127.0.0.1:*

# Contas de exemplo ao iniciar (DadosIniciais.java)
pix.seed.enabled=true
